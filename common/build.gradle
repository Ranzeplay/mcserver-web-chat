architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"
}

// Frontend build tasks
task checkPnpm {
    doLast {
        try {
            exec {
                commandLine 'pnpm', '--version'
            }
        } catch (Exception e) {
            throw new GradleException("pnpm is not installed. Please install pnpm to build the frontend.")
        }
    }
}

task buildFrontend(dependsOn: checkPnpm) {
    inputs.dir("${rootProject.projectDir}/web/src")
    inputs.file("${rootProject.projectDir}/web/package.json")
    inputs.file("${rootProject.projectDir}/web/pnpm-lock.yaml")
    outputs.dir("${rootProject.projectDir}/web/dist")
    
    doLast {
        exec {
            workingDir "${rootProject.projectDir}/web"
            commandLine 'pnpm', 'install'
        }
        exec {
            workingDir "${rootProject.projectDir}/web"
            commandLine 'pnpm', 'build'
        }
    }
}

task copyFrontendAssets(type: Copy, dependsOn: buildFrontend) {
    from "${rootProject.projectDir}/web/dist"
    into sourceSets.main.output.resourcesDir
}

processResources.dependsOn copyFrontendAssets
