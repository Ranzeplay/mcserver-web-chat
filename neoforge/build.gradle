plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
    
    // Include external dependencies from common module for shading
    shadowBundle 'io.netty:netty-handler:4.1.100.Final'
    shadowBundle 'io.netty:netty-codec-http:4.1.100.Final'
    shadowBundle 'io.netty:netty-transport:4.1.100.Final'
    shadowBundle 'io.netty:netty-common:4.1.100.Final'
    shadowBundle 'io.netty:netty-buffer:4.1.100.Final'
    shadowBundle 'io.netty:netty-transport-native-epoll:4.1.100.Final'
    shadowBundle 'io.netty:netty-transport-native-kqueue:4.1.100.Final'
    shadowBundle 'com.google.code.gson:gson:2.10.1'
    shadowBundle 'io.jsonwebtoken:jjwt-api:0.12.3'
    shadowBundle 'io.jsonwebtoken:jjwt-impl:0.12.3'
    shadowBundle 'io.jsonwebtoken:jjwt-gson:0.12.3'
    shadowBundle 'at.favre.lib:bcrypt:0.10.2'
    
    // BlueMap for development/debugging (not included in production builds)
    modLocalRuntime("de.bluecolored.bluemap:bluemap-neoforge:$rootProject.bluemap_version") { transitive = false }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
    
    // Don't relocate Netty since Minecraft uses it too and versions might be compatible
    // Only relocate other libraries to avoid conflicts
    relocate 'com.google.gson', 'space.ranzeplay.MCServerWebChat.shaded.com.google.gson'
    relocate 'io.jsonwebtoken', 'space.ranzeplay.MCServerWebChat.shaded.io.jsonwebtoken'
    relocate 'at.favre.lib.crypto', 'space.ranzeplay.MCServerWebChat.shaded.at.favre.lib.crypto'
}

remapJar {
    input.set shadowJar.archiveFile
}
